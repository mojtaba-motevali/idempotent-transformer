services:
  node1:
    image: idempotency-server:latest
    container_name: node1
    restart: unless-stopped
    command:
      - "--node-id=1"
      - "--addr-raft=0.0.0.0:8200"
      - "--rpc-addr=0.0.0.0:51000"
      - "--data-dir=/app/data"
      - "--node=1 node1:8200"
      - "--node=2 node2:8201"
      - "--node=3 node3:8202"
      - "--worker-threads=4"
    volumes:
      - data1:/app/data
    ports:
      - "51000:51000"   # gRPC
      - "8200:8200"     # Raft
    networks:
      - cluster_net

  node2:
    image: idempotency-server:latest
    container_name: node2
    restart: unless-stopped
    command:
      - "--node-id=2"
      - "--addr-raft=0.0.0.0:8201"
      - "--rpc-addr=0.0.0.0:51001"
      - "--data-dir=/app/data"
      - "--node=1 node1:8200"
      - "--node=2 node2:8201"
      - "--node=3 node3:8202"
      - "--worker-threads=4"
    volumes:
      - data2:/app/data
    ports:
      - "51001:51001"
      - "8201:8201"
    networks:
      - cluster_net

  node3:
    image: idempotency-server:latest
    container_name: node3
    restart: unless-stopped
    command:
      - "--node-id=3"
      - "--addr-raft=0.0.0.0:8202"
      - "--rpc-addr=0.0.0.0:51002"
      - "--data-dir=/app/data"
      - "--node=1 node1:8200"
      - "--node=2 node2:8201"
      - "--node=3 node3:8202"
      - "--worker-threads=4"
    volumes:
      - data3:/app/data
    ports:
      - "51002:51002"
      - "8202:8202"
    networks:
      - cluster_net

volumes:
  data1:
  data2:
  data3:

networks:
  cluster_net:
    driver: bridge
